name: tests
# The repository is private: Actions minutes are metered, so pushes to feature branches are covered by
# their pull request and the suite runs on one Python (3.11, the pipeline's).
on:
  push:
    branches: [claude/train-delay-analysis-framework-auxzv1, main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,lake]"
      - run: pytest -q
  relay:
    # the trip relay (relay/, a Cloudflare Worker) against a fake GitHub, with Node's own test runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
        working-directory: relay
