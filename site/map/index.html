<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whichway Live Map</title>
<meta name="description" content="Every NYC subway train live on a map, with line insights, a live insights feed, a trip planner and the reliability research behind Whichway.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="map.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-size='17' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div id="map" aria-label="Map of the subway with live trains"></div>

<header class="hud">
  <a class="brand" href="./" title="Whichway live map"><span class="brand-dot" aria-hidden="true"></span><span>Whichway</span><span class="brand-sub">Live</span></a>
  <div id="mode" class="mode" role="status"><span class="dot"></span><span class="txt">Loading…</span></div>
  <div id="kpis" class="kpis" aria-label="System now"></div>
  <div class="hud-right">
    <div class="search combo"><input id="search" class="combo-input" type="search" placeholder="Find a station or line" autocomplete="off" aria-label="Find a station or line"><ul id="search-list" class="combo-list" hidden></ul></div>
    <span id="clock" class="clock"></span>
    <a class="icon-btn hide-sm" href="../" title="Classic reports">Reports</a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </div>
</header>

<aside id="left" class="panel left open" aria-label="Line insights">
  <div class="panel-head">
    <div id="left-title" class="panel-title">Lines</div>
    <div class="row gap-s">
      <button id="left-back" class="icon-btn" type="button" hidden title="All lines">‹ All lines</button>
      <button id="left-wide" class="icon-btn hide-sm" type="button" title="Widen panel">⤢</button>
    </div>
  </div>
  <div id="left-body" class="panel-body"></div>
  <button class="tab-handle" data-panel="left" type="button" aria-label="Toggle line insights">Lines</button>
</aside>

<aside id="right" class="panel right open" aria-label="Insights feed and trip planner">
  <div class="panel-head">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="feed" class="on">Feed</button>
      <button role="tab" data-tab="route">Route</button>
      <button role="tab" data-tab="stations">Stations</button>
      <button role="tab" data-tab="system">System</button>
    </nav>
    <button id="right-wide" class="icon-btn hide-sm" type="button" title="Widen panel">⤢</button>
  </div>
  <div id="right-body" class="panel-body"></div>
  <button class="tab-handle" data-panel="right" type="button" aria-label="Toggle insights">Insights</button>
</aside>

<div id="layers" class="layers-card">
  <div class="kicker">Map</div>
  <label><input type="checkbox" data-layer="trains" checked> Trains</label>
  <label><input type="checkbox" data-layer="stations" checked> Stations</label>
  <label><input type="checkbox" data-layer="hotspots"> Hold &amp; dwell hotspots</label>
  <label><input type="checkbox" data-layer="events" checked> Live incidents</label>
  <div class="kicker" style="margin-top:.4rem">Colour trains by</div>
  <div class="seg" role="radiogroup">
    <button data-color="route" class="on" type="button">Line</button>
    <button data-color="late" type="button">Lateness</button>
  </div>
  <div id="legend" class="legend-late" hidden>
    <span><i style="background:var(--status-good)"></i>&lt; 2 min</span><span><i style="background:var(--status-warning)"></i>2–5</span><span><i style="background:var(--status-critical)"></i>5+ min</span><span><i style="background:var(--de-emphasis)"></i>unknown</span>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
