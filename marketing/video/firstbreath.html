<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WhichWay: First Breath</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="kit.js"></script>
<script src="engine.js"></script>
<script src="cine.js"></script>
<script src="nyc.js"></script>
<script>
// "First Breath": 2:47 AM, a message: "It's time." Three weeks early, and he is across the river on the night shift,
// at the hour when the trains run twenty minutes apart and one missed train is the whole thing missed. The app picks
// the 7 to the 6; he runs for the 7 in the rain; the 7 is held under the river while his time to spare for the 6
// drains from 2:40 to 0:40; he makes the 6 with two seconds left, runs the hospital corridor, and the door opens on
// the first cry. A heart monitor is the pulse of the film: her line and his along the bottom of every shot (his
// doubles when he runs), and at 3:21 AM a third one starts. A beat is 0.6 s and a bar 2.4 s; every cut is on a bar.
// 74 s. Drawn with nyc.js; the score is `firstbreath`.
const DURATION = 74.2, END = 67.2, B = 0.6;
const GRN = '#4df0b0', AMB = '#ffbf66', GOLD = '#fff0c4';
const MAN = { coat: '#e2553a', legs: '#0e1024', skin: '#b9825c', hair: { style: 'short', color: '#15100e' } };
const GROUND = 850, VW = 900, MANH = 118, RUN0 = 21.6, CAD = Math.PI / 0.3;   // the street, his speed along it (px/s), his height, a footfall every half beat
const line1 = { size: 72, weight: 700, spacing: -1.5 };
const beatK = t => Math.exp(-(((t % B) + B) % B) / 0.09);
const fmt = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, '0')}`;

// ---------- the monitor ----------
const qrs0 = d => gauss(d, 0, 0.011) - 0.22 * gauss(d, -0.032, 0.01) - 0.3 * gauss(d, 0.034, 0.012) + 0.2 * gauss(d, 0.2, 0.045) + 0.09 * gauss(d, -0.13, 0.03);
const qrs = (d, per) => qrs0(d) + qrs0(d - per) + qrs0(d + per);
const hisBeat = tau => (tau >= RUN0 && tau < 57.6 ? B / 2 : B);
/** One line of the monitor, scrolling to the left from its head at x1: a beat every `period` seconds (a number, or a
 *  function of time), each one landing on the film's beat. `from` is when the line began. */
function trace(t, y, period, color, { amp = 22, a = 1, x0 = 0, x1 = W, speed = 300, from = -1e9, w = 3 } = {}) {
  if (a <= 0 || t < from) return;
  const P = typeof period === 'function' ? period : () => period, p = new Path2D(), at = tau => { const per = P(tau); return y - amp * qrs(((tau + per / 2) % per + per) % per - per / 2, per); };
  let on = false;
  for (let x = x1; x >= x0; x -= 2) { const tau = t - (x1 - x) / speed; if (tau < from) break; on ? p.lineTo(x, at(tau)) : p.moveTo(x, at(tau)); on = true; }
  ctx.save(); ctx.globalAlpha *= a; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, color + '00'); g.addColorStop(0.3, color + 'bb'); g.addColorStop(1, color);
  ctx.strokeStyle = g; ctx.lineWidth = w; ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.stroke(p);
  const per = P(t), k = Math.exp(-(((t % per) + per) % per) / 0.12);
  ctx.fillStyle = '#fff'; ctx.shadowBlur = 20 + 30 * k; ctx.beginPath(); ctx.arc(x1, at(t), w * (1.1 + 0.9 * k), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function pulseLines(t) {
  const out = 1 - seg(t, END - 1.6, END - 0.9), tag = (s, x, y, color, size = 20) => text(s, x, y, { size, weight: 700, color, spacing: 2.5, align: 'right', base: 'middle', display: false });
  if (out <= 0) return;
  ctx.save(); ctx.globalAlpha = out;
  if (t >= 55.2 && t < 60) {   // the door: nothing but the lines, and then a third
    const three = t >= 57.6, o = { amp: 90, x0: 260, x1: 1500, w: 5 };
    trace(t, three ? 370 : 430, B, GRN, o); tag('HER', 220, three ? 370 : 430, GRN, 24);
    trace(t, three ? 730 : 650, hisBeat, AMB, o); tag('HIM', 220, three ? 730 : 650, AMB, 24);
    if (three) { trace(t, 550, B / 2, GOLD, { ...o, amp: 64, from: 57.6 }); text('3:21 AM', 1560, 550, { size: 40, weight: 700, color: GOLD, base: 'middle', mono: true, alpha: seg(t, 57.7, 58.3) }); }
  } else {
    const k = easeInOut(seg(t, 2.4, 3.4)), big = 1 + 0.6 * seg(t, 50.4, 55.2), three = t >= 60;
    if (k > 0) { const sg = ctx.createLinearGradient(0, 900, 0, H); sg.addColorStop(0, 'rgba(3,5,10,0)'); sg.addColorStop(1, `rgba(3,5,10,${0.75 * k})`); ctx.fillStyle = sg; ctx.fillRect(0, 900, W, 180); }
    const y1 = three ? 962 : 985, y2 = three ? 1004 : 1035;
    trace(t, lerp(540, y1, k), B, GRN, { amp: lerp(120, 20 * big, k), x0: lerp(260, 150, k), x1: lerp(1500, W - 70, k), w: lerp(5, 3, k), a: seg(t, 0.2, 0.9) * 0.95 });
    trace(t, y2, hisBeat, AMB, { amp: 20 * big, x0: 150, x1: W - 70, a: 0.95 * seg(t, 3.0, 3.6) });
    if (three) trace(t, 1046, B / 2, GOLD, { amp: 14, x0: 150, x1: W - 70, from: 57.6 });
    ctx.globalAlpha = out * k; tag('HER', 124, y1, GRN); ctx.globalAlpha = out * seg(t, 3.0, 3.6); tag('HIM', 124, y2, AMB);
  }
  ctx.restore();
}

// ---------- what the app and the clock say ----------
const CLOCK = [[0, '2:47'], [21.6, '2:48'], [24.0, '2:51'], [26.4, '2:54'], [28.8, '2:55'], [33.6, '2:59'], [36.6, '3:02'], [38.4, '3:03'], [40.2, '3:04'], [41.6, '3:05'], [43.2, '3:07'], [45.6, '3:09'], [48.0, '3:10'], [50.4, '3:19'], [55.2, '3:21']];
function clockChip(t) {
  const a = Math.min(seg(t, 1.0, 1.8), 1 - seg(t, 57.2, 57.6));
  if (a <= 0) return;
  let s = CLOCK[0][1]; CLOCK.forEach(([at, v]) => { if (t >= at) s = v; });
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,10,20,0.82)'; rrect(58, 48, 318, 104, 26); ctx.fill(); ctx.strokeStyle = C.cardLine; ctx.lineWidth = 2; ctx.stroke();
  text(s, 86, 124, { size: 68, weight: 700, mono: true });
  text('AM', 276, 124, { size: 28, weight: 600, color: C.dim, display: false });
  ctx.restore();
}
/** The count in the corner: what he is racing, to the second. */
function counts(t) {
  const a = Math.min(seg(t, 21.6, 21.9), 1 - seg(t, 50.2, 50.4));
  if (a <= 0) return;
  let label = 'DOORS OF THE 7 OPEN IN', secs, color = C.ink;
  if (t < 24.0) secs = 460 - (t - 21.6) * 4;
  else if (t < 26.4) secs = 252 - (t - 24.0) * 4;
  else if (t < 28.8) secs = 80 - (t - 26.4) * 4;
  else if (t < 33.6) { secs = 14.4 - (t - 28.8) * 4; if (secs <= 0) color = C.ok; }
  else if (t < 43.2) { label = 'TO SPARE FOR THE 6'; secs = 160 - 120 * seg(t, 37.2, 40.4); color = t >= 37.2 && t < 40.8 ? (secs < 70 ? C.red : HELD_C) : C.ink; }
  else if (t < 45.6) { label = 'THE 6 LEAVES IN'; secs = 190 - (t - 43.2) * 4; }
  else if (t < 48.0) { label = 'THE 6 LEAVES IN'; secs = 24 - (t - 45.6) * 4; }
  else { label = 'THE 6 LEAVES IN'; secs = Math.max(2, 10 - (t - 48.0) * 4.2); color = t >= 49.9 ? C.ok : secs < 6 ? C.red : C.ink; }
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,10,20,0.82)'; rrect(1466, 48, 396, 138, 26); ctx.fill(); ctx.strokeStyle = C.cardLine; ctx.lineWidth = 2; ctx.stroke();
  text(fmt(secs), 1494, 126, { size: 70, weight: 700, mono: true, color });
  text(label, 1496, 163, { size: 20, weight: 700, color: C.dim, spacing: 2.2, display: false });
  ctx.restore();
}
function card(t, at, out, title, sub) {
  const a = life(t, at, out, 0.4), cy = 96 - (1 - easeOut(seg(t, at, at + 0.5))) * 70;
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.fillStyle = 'rgba(16,22,44,0.95)'; rrect(510, cy, 900, 150, 34); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = C.cardLine; ctx.lineWidth = 2; rrect(510, cy, 900, 150, 34); ctx.stroke();
  iconTile(588, cy + 75, 88, 1, { stem: 1, right: 1, left: 1, dot: 1 });
  text(title, 656, cy + 66, { size: 38, weight: 700 });
  text(sub, 656, cy + 110, { size: 27, weight: 500, color: C.ice, display: false });
  ctx.restore();
}

// ---------- 0-7.2: the message ----------
function dock(t) {
  nightSky('#03040f', '#12143a', 0.3);
  drawBlock(BLOCKS.far, t, { base: 600, fill: '#10143c', dx: -300, winA: 0.35, lit: 0.2, sx: 10, sy: 13, ww: 3.5, wh: 5 });
  // the back wall of the bakery: brick, a lamp, the loading door rolled part of the way up
  const g = ctx.createLinearGradient(0, 200, 0, GROUND); g.addColorStop(0, '#191428'); g.addColorStop(1, '#261b2e'); ctx.fillStyle = g; ctx.fillRect(-400, 230, W + 800, GROUND - 230);
  ctx.fillStyle = 'rgba(0,0,0,0.22)'; for (let y = 250; y < GROUND; y += 22) ctx.fillRect(-400, y, W + 800, 2);
  ctx.fillStyle = '#0e0b18'; ctx.fillRect(-400, 214, W + 800, 22);
  const dx = 1250, dw = 470, dt = 420;
  ctx.fillStyle = '#0a0812'; ctx.fillRect(dx - 16, dt - 16, dw + 32, GROUND - dt + 16);
  const ig = ctx.createLinearGradient(0, dt, 0, GROUND); ig.addColorStop(0, '#ffd28a'); ig.addColorStop(1, '#f7a95a'); ctx.fillStyle = ig; ctx.fillRect(dx, dt, dw, GROUND - dt);
  for (let r = 0; r < 2; r++) {   // racks of bread
    const rx = dx + 40 + r * 220;
    ctx.fillStyle = 'rgba(70,40,24,0.85)'; ctx.fillRect(rx, dt + 150, 8, GROUND - dt - 150); ctx.fillRect(rx + 172, dt + 150, 8, GROUND - dt - 150);
    for (let s = 0; s < 4; s++) { const sy = dt + 170 + s * 62; ctx.fillStyle = 'rgba(70,40,24,0.85)'; ctx.fillRect(rx, sy + 30, 180, 6); for (let b = 0; b < 4; b++) { ctx.fillStyle = 'rgba(160,96,44,0.9)'; ctx.beginPath(); ctx.ellipse(rx + 28 + b * 42, sy + 20, 18, 11, 0, 0, Math.PI * 2); ctx.fill(); } }
  }
  ctx.fillStyle = '#2c3040'; ctx.fillRect(dx, dt, dw, 130); ctx.fillStyle = 'rgba(0,0,0,0.3)'; for (let y = dt + 10; y < dt + 130; y += 16) ctx.fillRect(dx, y, dw, 3);
  glowAt(dx + dw / 2, GROUND - 160, 640, '255,190,110', 0.45);
  ctx.fillStyle = '#0a0812'; ctx.fillRect(dx + dw / 2 - 4, dt - 100, 8, 34); ctx.fillStyle = '#ffe9b8'; ctx.beginPath(); ctx.ellipse(dx + dw / 2, dt - 60, 26, 11, 0, 0, Math.PI * 2); ctx.fill(); glowAt(dx + dw / 2, dt - 56, 300, '255,214,150', 0.45);
  ctx.fillStyle = '#3a2a1c'; ctx.fillRect(dx - 190, GROUND - 84, 120, 84); ctx.fillStyle = '#4a3624'; ctx.fillRect(dx - 176, GROUND - 156, 96, 72); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(dx - 190, GROUND - 44, 120, 4); ctx.fillRect(dx - 176, GROUND - 120, 96, 4);
  const pg = ctx.createLinearGradient(0, GROUND, 0, H); pg.addColorStop(0, '#17152c'); pg.addColorStop(0.25, '#0b0b1a'); pg.addColorStop(1, '#030308'); ctx.fillStyle = pg; ctx.fillRect(-400, GROUND, W + 800, H - GROUND + 300);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const lg = ctx.createLinearGradient(0, GROUND, 0, GROUND + 230); lg.addColorStop(0, 'rgba(255,190,110,0.5)'); lg.addColorStop(1, 'rgba(255,190,110,0)'); poly([[dx, GROUND], [dx + dw, GROUND], [dx + dw + 170, GROUND + 230], [dx - 170, GROUND + 230]], lg); ctx.restore();
}
function bubble(t, at, s, x, y) {
  if (t < at) return;
  const k = expoOut(seg(t, at, at + 0.45)), w = measure(s, 84, 600) + 100, z = lerp(0.82, 1, k);
  ctx.save(); ctx.globalAlpha = seg(t, at, at + 0.12); ctx.translate(x, y + 150); ctx.scale(z, z); ctx.translate(-x, -(y + 150));
  text('ANA   2:47 AM', x + 8, y - 22, { size: 24, weight: 700, color: C.dim, spacing: 3, display: false });
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 36; ctx.fillStyle = '#2c3348'; rrect(x, y, w, 150, 56); ctx.fill(); ctx.shadowBlur = 0;
  poly([[x + 18, y + 118], [x - 16, y + 156], [x + 62, y + 142]], '#2c3348');
  text(s, x + 50, y + 104, { size: 84, weight: 600 });
  ctx.restore();
}
function sCall(t) {
  if (t < 2.4) return;
  const e = easeInOut(seg(t, 2.4, 7.2)), hx = 1010, hy = GROUND + 30, hh = 330, u = hh / 100;
  camera(1.05 + 0.17 * e, lerp(980, 1010, e), lerp(560, 610, e), () => {
    dock(t);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(hx, hy + 6, 62, 11, 0, 0, Math.PI * 2); ctx.fill();
    figure(hx, hy, hh, { ...MAN, dir: -1, arm: 'watch', nod: -0.22, breathe: t * 2.2 });
    const px = hx - 11 * u, py = hy - 77 * u;   // the phone in his hand, and its light on his face
    ctx.fillStyle = '#e4edff'; ctx.beginPath(); ctx.roundRect(px - 8, py - 22, 15, 28, 3); ctx.fill();
    glowAt(px, py - 10, 150, '190,215,255', 0.55 * (0.4 + 0.6 * seg(t, 2.9, 3.1)));
  });
  rain(t, 0.8);
  scrim('left', 0.8);
  if (t < 2.9) { ctx.fillStyle = `rgba(0,0,0,${1 - seg(t, 2.4, 2.9)})`; ctx.fillRect(0, 0, W, H); }
  bubble(t, 3.0, 'It’s time.', 150, 330);
  say(t, 'Three weeks early.', 150, 690, 4.8, 7.0, line1);
}

// ---------- 7.2-14.4: the river ----------
function sRiver(t) {
  const u = t - 7.2, beat = beatK(t);
  const hx = 1392, hy = 652;   // her window, on the far side
  camera(1.0 + 0.08 * u / 7.2, hx, hy, () => {
    skyline(t, { drift: 60 + u * 9, base: 850 });
    glowAt(hx, hy, 190, '77,240,176', 0.35 + 0.45 * beat); ctx.fillStyle = GRN; ctx.beginPath(); ctx.arc(hx, hy, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(hx, hy, 19 + 8 * beat, 0, Math.PI * 2); ctx.stroke();
    shadowed(() => text('HER', hx + 40, hy + 8, { size: 24, weight: 700, spacing: 3, display: false }));
  }, [hx, hy]);
  rain(t, 0.7);
  scrim('left', 0.82);
  say(t, 'She is across the river.', 150, 500, 7.5, 9.4, line1);
  say(t, 'After midnight, the trains run', 150, 450, 9.8, 11.7, line1);
  say(t, 'twenty minutes apart.', 150, 545, 10.2, 11.7, line1);
  slam(t, 'Miss one,', 150, 450, 12.0, 14.1, { size: 104, spacing: -2.5 });
  slam(t, 'and he misses it.', 150, 570, 12.6, 14.1, { size: 104, spacing: -2.5, color: AMB });
}

// ---------- 14.4-21.6: everything the city knows ----------
const N7 = NETWORK.find(l => l.n === '7'), N6 = NETWORK.find(l => l.n === '6');
const ROUTE = (() => {
  const path = new Path2D(); let len = 0, last = null;
  const add = pt => { if (last) { path.lineTo(pt[0], pt[1]); len += Math.hypot(pt[0] - last[0], pt[1] - last[1]); } else path.moveTo(pt[0], pt[1]); last = pt; };
  for (let i = 0; i <= 24; i++) add(netAt(N7, lerp(0.27, 0.78, i / 24)));
  for (let i = 0; i <= 16; i++) add(netAt(N6, lerp(0.66, 0.37, i / 16)));
  return { path, len };
})();
function sData(t) {
  const u = t - 14.4, beat = beatK(t), him = netAt(N7, 0.27), her = netAt(N6, 0.37);
  ctx.fillStyle = '#04050d'; ctx.fillRect(0, 0, W, H);
  camera(0.92 + 0.05 * u / 7.2, 500, 470, () => {
    dataField(t, 1, false);
    for (let i = 0; i < 90; i++) {   // signals going off all along the lines
      const l = NETWORK[i % NETWORK.length], per = 0.9 + hash(i * 3.1) * 1.4, ph = ((t + hash(i * 7.7) * per) % per) / per, [sx, sy] = netAt(l, hash(i * 1.9 + Math.floor((t + hash(i * 7.7) * per) / per) * 0.37));
      ctx.strokeStyle = `rgba(190,215,255,${0.7 * (1 - ph)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, 3 + ph * 26, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.save(); ctx.setLineDash([ROUTE.len * easeInOut(seg(t, 16.4, 18.4)), ROUTE.len * 2]); glowStroke(ROUTE.path, '#ffffff', 9, 26, 0.95); ctx.restore();   // the way there lights up
    [[him, '255,191,102', AMB, 'HIM', -1], [her, '77,240,176', GRN, 'HER', 1]].forEach(([[x, y], rgb, c, s, side]) => {
      glowAt(x, y, 130, rgb, 0.5 + 0.4 * beat); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, 21, 0, Math.PI * 2); ctx.stroke();
      shadowed(() => text(s, x + side * 38, y + (side < 0 ? 52 : 8), { size: 24, weight: 700, spacing: 3, align: side < 0 ? 'center' : 'left', display: false }));
    });
  });
  scrim('left', 0.85);
  say(t, 'Every train still', 150, 450, 14.7, 17.1, line1);
  say(t, 'running tonight.', 150, 545, 14.9, 17.1, line1);
  slam(t, 'All of it,', 150, 450, 17.5, 21.3, { size: 104, spacing: -2.5 });
  slam(t, 'for him.', 150, 570, 18.1, 21.3, { size: 104, spacing: -2.5, color: AMB });
  card(t, 16.4, 21.4, '7 to the 6: there by 3:16', 'Doors open at Court Sq in 7:40. Miss it: 3:36.');
}

// ---------- 21.6-28.8: the run ----------
const runX = t => 600 + VW * (t - RUN0);
function runner(x, y, h, t, { o = {}, ghosts = 3 } = {}) {
  const ph = (t - RUN0) * CAD, hop = Math.abs(Math.sin(ph)) * h * 0.05, pose = { ...MAN, walk: ph, stride: 1.8, lean: 0.26, tails: 0.8, arm: 'pump', ...o };
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x, y + h * 0.02, h * 0.2, h * 0.035, 0, 0, Math.PI * 2); ctx.fill();
  for (let g = ghosts; g > 0; g--) { ctx.save(); ctx.globalAlpha *= 0.15; figure(x - (pose.dir || 1) * g * h * 0.12, y - hop, h, { ...pose, walk: ph - g * 0.5 }); ctx.restore(); }
  figure(x, y - hop, h, pose);
}
function lampsAlong(x0, x1, sm) {
  for (let i = Math.floor(x0 / 700) - 1; i < x1 / 700 + 1; i++) {
    const x = i * 700 + 300;
    ctx.strokeStyle = '#05060c'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x, GROUND - 330); ctx.quadraticCurveTo(x, GROUND - 380, x + 46, GROUND - 380); ctx.stroke();
    for (let g = 0; g < 3; g++) glowAt(x + 52 + g * sm * 0.8, GROUND - 372, 250, '255,214,150', 0.2);
    ctx.fillStyle = '#ffe9b8'; ctx.beginPath(); ctx.ellipse(x + 52 + sm * 0.4, GROUND - 372, 15 + sm * 0.5, 9, 0, 0, Math.PI * 2); ctx.fill();
  }
}
function wetPavement(t, x0, x1, sm = 0) {
  const g = ctx.createLinearGradient(0, GROUND, 0, GROUND + 260); g.addColorStop(0, '#1d2046'); g.addColorStop(0.12, '#0c0e24'); g.addColorStop(1, '#030308');
  ctx.fillStyle = g; ctx.fillRect(x0 - 100, GROUND, x1 - x0 + 200, 500);
  ctx.fillStyle = 'rgba(170,190,255,0.25)'; ctx.fillRect(x0 - 100, GROUND + 36, x1 - x0 + 200, 2.5);
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 100, GROUND + 1, x1 - x0 + 200, 500); ctx.clip();
  for (let i = Math.floor(x0 / 700) - 1; i < x1 / 700 + 1; i++) { ctx.save(); ctx.translate(i * 700 + 352 + sm, GROUND + 40); ctx.scale(1.4 + sm * 0.05, 4); glowAt(0, 0, 30, '255,205,130', 0.5); ctx.restore(); }
  ctx.restore();
  for (let i = Math.floor(x0 / 90) - 1; i < x1 / 90 + 1; i++) { ctx.fillStyle = `rgba(190,210,255,${0.06 + 0.12 * hash(i + 3)})`; ctx.fillRect(i * 90 + hash(i) * 40, GROUND + 4 + hash(i + 7) * 28, 5 + sm * 1.5, 1.6); }
}
/** The camera runs with him through the rain. `k` is how close, `lead` how much room he has in front. */
function chase(t, { k = 3, lead = 0.13, fy = GROUND - 95, mirror = false, lines = 0.8, under = null, front = null } = {}) {
  const X = runX(t), fx = X + (W * lead) / k, x0 = fx - W / 2 / k - 60, x1 = fx + W / 2 / k + 60, sm = (VW / 30) * 0.85;
  ctx.save(); if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  nightSky('#03040f', '#141a48', 0.4);
  drawBlock(BLOCKS.far, t, { base: 380, fill: '#10143c', dx: -((X * 0.012) % 200), winA: 0.4, lit: 0.22, sx: 10, sy: 13, ww: 3.5, wh: 5 });

    ctx.fillStyle = BABY; ctx.beginPath(); ctx.ellipse(1040, 560, 36, 26, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = 'rgba(150,80,60,0.35)'; ctx.lineWidth = 3; ctx.stroke();

// ---------- 62.4-67.2: morning ----------
function sDawn(t) {
  const u = seg(t, 62.4, 67.2), g = ctx.createLinearGradient(0, 0, 0, 860);
  [[0, '#0b1240'], [0.4, '#3a2c78'], [0.7, '#c2577a'], [0.88, '#ff9a5c'], [1, '#ffd9a0']].forEach(([k, c]) => g.addColorStop(k, c));
  camera(1.0 + 0.05 * u, 1100, 540, () => {
    ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, H + 200);

    // him, and who he is holding
    const hx = 1440, hy = 1060, hh = 640, s = hh / 100;
    figure(hx, hy, hh, { coat: '#6a2419', legs: '#090a14', skin: '#7a513a', hair: MAN.hair, dir: -1, arm: 'hold', nod: -0.3, breathe: t * 1.6 });
    const bx = hx - 15 * s, by = hy - 66 * s;

    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; glowAt(hx - 230, hy - 520, 380, '255,170,110', 0.2); ctx.restore();
  }, [1100, 540]);
  scrim('left', 0.7);
  say(t, 'Nobody will remember', 150, 440, 62.8, 66.3, line1);
  say(t, 'the train.', 150, 535, 63.0, 66.3, line1);

}

// ---------- the cut ----------
const SCENES = [[0, sCall], [7.2, sRiver], [14.4, sData], [21.6, sRun], [28.8, sEl], [33.6, sTunnel], [43.2, sStairs], [45.6, sPlatform], [48.0, sDoors], [50.4, sCorridor], [55.2, sHush], [60.0, sHand], [62.4, sDawn]];
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let scene = SCENES[0][1]; SCENES.forEach(([at, fn]) => { if (t >= at) scene = fn; });
  ctx.save(); scene(t); ctx.restore();
  if (t >= 57.6 && t < 58.8) { ctx.fillStyle = `rgba(255,244,214,${0.8 * Math.pow(1 - seg(t, 57.6, 58.8), 2)})`; ctx.fillRect(0, 0, W, H); }   // the door opens

  if (t >= END - 1.0) { const a = seg(t, END - 1.0, END + 0.1); ctx.fillStyle = `rgba(5,7,13,${a})`; ctx.fillRect(0, 0, W, H); endCardData(t, END, 'Be there for the first breath.', 'COMING SOON FOR IPHONE'); }
  grain(t, 0.1);
  vignette(0.5);
  blackFades(t, DURATION);
}
