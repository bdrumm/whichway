<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WhichWay: Pickup</title>
<style>html, body { margin: 0; background: #05070d; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="kit.js"></script>
<script src="pickup-kit.js"></script>
<script>
// "Pickup": the train is held on the way to school pickup; the app's own screens (the saved commute, boarding
// detection, the hold and how holds here end, the arrival window) give the warning early enough to ask a friend. 60 s.
const DURATION = 60;

function backdrop(t) {
  // underground navy while riding, afternoon warmth at the school and the park
  const warm = Math.max(seg(t, 29.6, 31.2) * (1 - seg(t, 36.4, 37.6)), seg(t, 49.6, 51.2));
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${lerp(8, 44, warm)},${lerp(12, 46, warm)},${lerp(30, 84, warm)})`);
  g.addColorStop(1, `rgb(${lerp(10, 214, warm)},${lerp(18, 128, warm)},${lerp(44, 84, warm)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  return warm;
}
/** Two lines on the left of the phone, and an optional smaller note. */
function say(t, a, b, at, out, { colB = C.ice, note = null } = {}) {
  riseText(t, a, 180, 440, at, out, { size: 70, weight: 800 });
  if (b) riseText(t, b, 180, 526, at + 0.6, out, { size: 70, weight: 800, color: colB });
  if (note) note.forEach((n, i) => riseText(t, n, 184, 620 + i * 42, at + 1.6 + i * 0.2, out, { size: 30, weight: 500, color: C.dim, display: false }));
}

function render(t) {
  ctx.save(); ctx.clearRect(0, 0, W, H);
  backdrop(t);
  dust(t, 0.3);

  // the time that matters
  clock(W / 2, 470, 150, 5, life(t, 0.6, 6.2, 0.6));
  riseText(t, '2:58 PM', W / 2, 740, 1.2, 5.6, { size: 34, weight: 600, align: 'center', color: C.ice, spacing: 6, display: false });
  riseText(t, 'School lets out at 3:30.', W / 2, 830, 2.0, 5.6, { size: 72, weight: 800, align: 'center' });

  // the phone, its screen following the story
  const pa = Math.max(life(t, 6.2, 30, 0.7), life(t, 37.4, 49.8, 0.7));
  if (pa > 0) {
    const inK = t < 33 ? easeOut(seg(t, 6.2, 7.6)) : easeOut(seg(t, 37.4, 38.6));
    const shake = t > 22.4 && t < 22.8 ? Math.sin(t * 90) * 4 * (1 - seg(t, 22.4, 22.8)) : 0;
    phone(lerp(1640, 1460, inK) + shake, 540, 1.0, pa, () => {
      const xf = (a, b) => life(t, a, b, 0.4);
      ctx.save(); ctx.globalAlpha *= xf(5.8, 14.6); screenGo(t); ctx.restore();
      ctx.save(); ctx.globalAlpha *= xf(14.4, 21.8); screenDetect(t); ctx.restore();
      ctx.save(); ctx.globalAlpha *= xf(21.6, 31); screenHold(t); ctx.restore();
      ctx.save(); ctx.globalAlpha *= xf(37, 45.2); screenMessages(t); ctx.restore();
      ctx.save(); ctx.globalAlpha *= xf(45, 50.4); screenArrived(t); ctx.restore();
    });
  }
  say(t, 'Your School pickup', 'commute is already up.', 6.8, 14.2,
    { note: ['It switches on in its time window:', 'take the A at 3:05, in at 3:27.'] });
  say(t, 'You step on.', 'It knows which train.', 14.8, 21.4,
    { note: ['It feels the train pull away and matches', 'it to the live feed. No tapping.'] });
  say(t, '3:10. The train', 'is held.', 22.2, 29.6,
    { colB: HELD, note: ['WhichWay sees the hold in the feed, and', 'how holds here usually end: 3:41 as usual,', '3:49 if it drags on.'] });

  // the gate, where someone will be waiting
  const sa = life(t, 29.8, 37.2, 0.8);
  school(t, sa, easeInOut(seg(t, 32, 35)));
  if (sa > 0) {
    ctx.save(); ctx.globalAlpha = sa; person(1140, 870, 0.9, '#fff', true); ctx.restore();
    riseText(t, 'You’ll be about 11 minutes late.', 140, 300, 30.4, 36.6, { size: 62, weight: 800 });
    riseText(t, 'Maya will be at the gate,', 140, 382, 31.6, 36.6, { size: 62, weight: 800, color: WARM });
    riseText(t, 'looking for you.', 140, 464, 32.4, 36.6, { size: 62, weight: 800, color: WARM });
  }

  say(t, 'It’s only 3:12.', 'Enough time to ask.', 37.8, 44.6,
    { note: ['With a real arrival time to give,', 'not a guess.'] });
  say(t, '3:41.', 'Right when it said.', 45.4, 49.6, { colB: C.ok });

  // the park
  const wa = life(t, 49.8, 55, 0.7);
  if (wa > 0) {
    ctx.save(); ctx.globalAlpha = wa;
    ctx.fillStyle = '#1a1426'; ctx.fillRect(0, 870, W, H - 870);
    for (let i = 0; i < 6; i++) {
      const x = 200 + i * 320;
      ctx.fillStyle = '#231c33'; ctx.fillRect(x - 8, 700, 16, 170);
      ctx.fillStyle = '#2b2a45'; ctx.beginPath(); ctx.arc(x, 670, 90, 0, Math.PI * 2); ctx.fill();
    }
    const walk = (t - 49.8) * 40;
    person(700 + walk, 870, 1.1, '#fff');
    person(760 + walk, 870, 0.75, '#ffe7c2', true);
    person(820 + walk, 870, 0.8, '#fff', true);
    const catchK = easeInOut(seg(t, 51.6, 54));
    person(lerp(-60, 640 + walk, catchK), 870, 1.1, WARM);
    ctx.restore();
    riseText(t, 'Being late is a problem.', W / 2, 330, 50.2, 54.4, { size: 70, weight: 800, align: 'center' });
    riseText(t, 'Knowing early is a plan.', W / 2, 420, 51, 54.4, { size: 70, weight: 800, align: 'center', color: WARM });
  }

  endCard(t, 54.8, 'Know before it matters.', null);
  vignette(0.5);
  blackFades(t, DURATION);
  ctx.restore();
}
boot(DURATION, render);
</script>
</body>
</html>
