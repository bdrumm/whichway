<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WhichWay film</title>
<style>
  html, body { margin: 0; background: #05070d; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// The WhichWay product film, drawn on one canvas. render(t) draws the frame at t seconds, so the renderer
// (render.mjs) can step through it frame by frame; opening the page plays it in real time.
const W = 1920, H = 1080, DURATION = 62;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg0: '#05070d', bg1: '#0a1430', ink: '#f4f6fb', dim: 'rgba(244,246,251,0.62)', faint: 'rgba(244,246,251,0.28)',
  blue: '#2e7cff', sky: '#5b9bff', ice: '#9cc4ff', card: 'rgba(20,30,58,0.86)', cardLine: 'rgba(156,196,255,0.18)',
  late: '#ff7a1a', red: '#ff4a3d', ok: '#3ddc97',
};
// MTA line colours.
const L = {
  A: '#0039a6', C: '#0039a6', E: '#0039a6', F: '#ff6319', D: '#ff6319', M: '#ff6319', N: '#fccc0a', Q: '#fccc0a',
  R: '#fccc0a', 1: '#ee352e', 2: '#ee352e', 3: '#ee352e', 4: '#00933c', 5: '#00933c', 6: '#00933c', 7: '#b933ad',
  G: '#6cbe45', L: '#a7a9ac', J: '#996633', B: '#ff6319',
};

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const expoOut = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
/** 0 → 1 → 0 over [a, b], with fades of length f at both ends. */
const life = (t, a, b, f = 0.5) => Math.min(easeOut(seg(t, a, a + f)), 1 - easeIn(seg(t, b - f, b)));
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function noise1(x, seed = 0) {
  const i = Math.floor(x), f = x - i, h = n => { const s = Math.sin((n + seed * 131.7) * 127.1) * 43758.5453; return s - Math.floor(s); };
  const u = f * f * (3 - 2 * f); return lerp(h(i), h(i + 1), u) * 2 - 1;
}

function font(size, weight = 600, display = true) { return `${weight} ${size}px ${display ? '"Inter Display", Inter' : 'Inter'}, sans-serif`; }
function text(s, x, y, { size = 40, weight = 600, color = C.ink, alpha = 1, align = 'left', base = 'alphabetic', spacing = 0, display = true, mono = false } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = mono ? `${weight} ${size}px "DejaVu Sans Mono", monospace` : font(size, weight, display);
  ctx.letterSpacing = `${spacing}px`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 600, spacing = 0) {
  ctx.save(); ctx.font = font(size, weight); ctx.letterSpacing = `${spacing}px`; const w = ctx.measureText(s).width; ctx.restore(); return w;
}
/** A line of text that rises into place and fades in, starting at `at`; leaves at `out`. */
function riseText(t, s, x, y, at, out, opts = {}) {
  const k = easeOut(seg(t, at, at + 0.9));
  const o = out == null ? 1 : 1 - easeIn(seg(t, out, out + 0.6));
  const dy = (1 - k) * (opts.rise ?? 28) - (out == null ? 0 : easeIn(seg(t, out, out + 0.6)) * 14);
  ctx.save();
  if (opts.blur) ctx.filter = `blur(${(1 - k) * 10}px)`;
  text(s, x, y + dy, { ...opts, alpha: (opts.alpha ?? 1) * k * o });
  ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function bullet(x, y, r, label, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = L[label] || C.blue; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  const dark = 'NQR'.includes(label);
  text(label, x, y + r * 0.04, { size: r * 1.25, weight: 700, color: dark ? '#111' : '#fff', align: 'center', base: 'middle', display: false });
  ctx.restore();
}
function glowStroke(path, color, width, glow = 18, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = glow; ctx.lineWidth = width; ctx.stroke(path);
  ctx.shadowBlur = 0; ctx.stroke(path); ctx.restore();
}
function background(t, tint = 0) {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.35, 50, W * 0.5, H * 0.5, W * 0.75);
  g.addColorStop(0, `rgb(${lerp(13, 20, tint)},${lerp(24, 40, tint)},${lerp(56, 92, tint)})`);
  g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
/** Slow drifting dust, for depth. */
function dust(t, alpha = 0.5, n = 70) {
  const r = rng(7);
  ctx.save();
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, sp = 6 + r() * 22, s = 0.6 + r() * 1.8;
    const x = (x0 + t * sp) % (W + 40) - 20, y = y0 + Math.sin(t * 0.3 + i) * 8;
    ctx.globalAlpha = alpha * (0.15 + 0.5 * r());
    ctx.fillStyle = C.ice; ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function vignette(a = 0.65) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- the phone ----------
const PW = 420, PH = 860;
function phone(cx, cy, scale, alpha, drawScreen) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-PW / 2, -PH / 2);
  ctx.shadowColor = 'rgba(46,124,255,0.35)'; ctx.shadowBlur = 90;
  rrect(-14, -14, PW + 28, PH + 28, 78); ctx.fillStyle = '#1b1f2a'; ctx.fill();
  ctx.shadowBlur = 0;
  rrect(-14, -14, PW + 28, PH + 28, 78); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.stroke();
  rrect(0, 0, PW, PH, 64); ctx.save(); ctx.clip();
  const g = ctx.createLinearGradient(0, 0, 0, PH); g.addColorStop(0, '#0d1630'); g.addColorStop(1, '#060a16');
  ctx.fillStyle = g; ctx.fillRect(0, 0, PW, PH);
  drawScreen();
  ctx.restore();
  rrect(PW / 2 - 62, 16, 124, 36, 18); ctx.fillStyle = '#000'; ctx.fill();
  text('9:41', 50, 44, { size: 20, weight: 600, display: false });
  ctx.restore();
}
function screenCard(x, y, w, h, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  rrect(x, y, w, h, 26); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
}
function chip(x, y, label, color, alpha = 1, size = 20) {
  if (alpha <= 0) return;
  const w = measure(label, size, 600) + 34;
  ctx.save(); ctx.globalAlpha *= alpha;
  rrect(x, y, w, size + 18, (size + 18) / 2); ctx.fillStyle = color + '33'; ctx.fill();
  ctx.strokeStyle = color + '99'; ctx.lineWidth = 1.5; ctx.stroke();
  text(label, x + 17, y + (size + 18) / 2 + 1, { size, weight: 600, color, base: 'middle' });
  ctx.restore();
  return w;
}

// ---------- the icon ----------
/** The app icon's switch: a faded branch, the bright branch to a station dot, the stem to a hollow ring.
 *  p0..p3 reveal the parts (0..1). Coordinates in a 1024 box. */
function iconMark(cx, cy, size, { stem = 1, right = 1, left = 1, dot = 1, color = '#fff', glow = 0 } = {}) {
  const s = size / 1024;
  ctx.save(); ctx.translate(cx - size / 2, cy - size / 2); ctx.scale(s, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 92;
  const fork = [512, 560];
  const leftPath = new Path2D(); leftPath.moveTo(fork[0], fork[1]); leftPath.bezierCurveTo(470, 520, 330, 450, 330, 330); leftPath.lineTo(330, 300);
  const rightPath = new Path2D(); rightPath.moveTo(fork[0], fork[1]); rightPath.bezierCurveTo(560, 515, 700, 440, 712, 300);
  const stemPath = new Path2D(); stemPath.moveTo(512, 560); stemPath.lineTo(512, 680);
  const dash = (len, k) => { ctx.setLineDash([len * k, len * 2]); };
  if (glow) { ctx.shadowColor = C.sky; ctx.shadowBlur = glow / s; }
  if (left > 0) { ctx.strokeStyle = 'rgba(255,255,255,0.35)'; dash(420, left); ctx.stroke(leftPath); }
  if (stem > 0) { ctx.strokeStyle = color; dash(130, stem); ctx.stroke(stemPath); }
  if (right > 0) { ctx.strokeStyle = color; dash(400, right); ctx.stroke(rightPath); }
  ctx.setLineDash([]);
  if (stem > 0) {
    ctx.beginPath(); ctx.arc(512, 770, 104 * easeOut(clamp(stem * 1.4 - 0.2)), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(512, 770, 46 * easeOut(clamp(stem * 1.4 - 0.2)), 0, Math.PI * 2); ctx.globalCompositeOperation = 'destination-out'; ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  if (dot > 0) { ctx.beginPath(); ctx.arc(726, 262, 112 * expoOut(dot), 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
  ctx.restore();
}
function iconTile(cx, cy, size, k, markK) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
  const x = cx - size / 2, y = cy - size / 2;
  ctx.shadowColor = 'rgba(46,124,255,0.6)'; ctx.shadowBlur = 120;
  rrect(x, y, size, size, size * 0.225);
  const g = ctx.createLinearGradient(x, y, x + size, y + size); g.addColorStop(0, '#4a8dff'); g.addColorStop(0.55, '#0a49c9'); g.addColorStop(1, '#0035a8');
  ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  rrect(x, y, size, size, size * 0.225); ctx.save(); ctx.clip();
  // the left-branch ring cut-out reads as hollow on the tile, so redraw it in the tile's colour
  iconMark(cx, cy, size, markK);
  ctx.restore();
  ctx.restore();
}

// ---------- scene 1+2: the city, lines, the fork ----------
const routes = (() => {
  const r = rng(42), names = ['A', 'F', '4', 'N', '1', '7', 'G', 'L', 'Q', '6', 'C', '2', 'R', 'M'];
  return names.map((n, i) => {
    const y0 = 120 + (i / (names.length - 1)) * 840 + (r() - 0.5) * 40;
    return { n, y0, a1: (r() - 0.5) * 260, a2: (r() - 0.5) * 260, ph: r() * 6, speed: 0.6 + r() * 0.5, delay: r() * 1.6 };
  });
})();
function cityLines(t, conv, alpha) {
  // conv: 0 = spread across the screen, 1 = gathered into one trunk that forks at the centre
  if (alpha <= 0) return;
  const fx = W * 0.5, fy = H * 0.58;
  routes.forEach((r, i) => {
    const draw = easeInOut(seg(t, 0.2 + r.delay, 3.2 + r.delay));
    if (draw <= 0) return;
    const p = new Path2D();
    const ya = lerp(r.y0, fy + 300 + (i - 7) * 3, conv), yb = lerp(r.y0 + r.a1, fy + (i - 7) * 4, conv);
    const yc = lerp(r.y0 + r.a2, fy - 200 - (i % 2 ? -1 : 1) * 0, conv);
    const side = i % 2 ? -1 : 1;
    const xEnd = lerp(W + 40, fx + side * lerp(330, 420, (i % 7) / 6), conv);
    const yEnd = lerp(r.y0 + r.a2 * 0.4, fy - 420 + (i % 7) * 18, conv);
    const xStart = lerp(-40, fx, conv);
    p.moveTo(xStart, lerp(r.y0, H + 40, conv));
    p.bezierCurveTo(lerp(W * 0.3, fx, conv), ya, lerp(W * 0.55, fx, conv), yb, lerp(W * 0.7, fx + side * 60, conv), lerp(yc, fy - 120, conv));
    p.bezierCurveTo(lerp(W * 0.85, fx + side * 250, conv), lerp(yc, fy - 260, conv), lerp(W * 0.95, xEnd, conv), yEnd, xEnd, yEnd);
    ctx.save();
    ctx.setLineDash([2600 * draw, 4000]);
    glowStroke(p, L[r.n], lerp(5, 7, conv), 14, alpha * lerp(0.75, 0.9, conv));
    ctx.restore();
    // a train of light travelling along the line
    if (conv < 0.3) {
      ctx.save(); ctx.setLineDash([60, 2600]); ctx.lineDashOffset = -((t * 700 * r.speed + r.ph * 300) % 2660);
      glowStroke(p, '#ffffff', 6, 22, alpha * draw * (1 - conv / 0.3) * 0.9); ctx.restore();
    }
  });
}

// ---------- scene 3: detection ----------
function motionSignal(i) {
  // i = sample index (20 per second of film). walking, then standing, then the push, then the ride.
  const s = i / 20;
  const walk = 1 - seg(s, 13.3, 13.8), push = Math.exp(-Math.pow((s - 15.4) / 0.9, 2)), ride = seg(s, 15.2, 16.2);
  const step = walk * (Math.abs(Math.sin(s * 11)) * 0.9 + noise1(s * 30, 1) * 0.15);
  const shake = ride * (noise1(s * 40, 2) * 0.22 + noise1(s * 9, 3) * 0.08);
  return clamp(step + push * 0.75 + shake + noise1(s * 50, 4) * 0.03, -1, 1.2);
}
function detectionScreen(t) {
  // header
  text('Trip', 32, 120, { size: 22, weight: 600, color: C.dim, display: false });
  text('Jay St–MetroTech', 32, 160, { size: 34, weight: 700 });
  text('→  W 4 St–Wash Sq', 32, 200, { size: 24, weight: 500, color: C.dim, display: false });
  // motion card
  screenCard(20, 236, PW - 40, 250);
  text('MOTION', 44, 276, { size: 15, weight: 700, color: C.faint, spacing: 2, display: false });
  const now = t * 20, n = 140, x0 = 44, x1 = PW - 44, yMid = 390;
  ctx.save(); ctx.beginPath();
  for (let k = 0; k <= n; k++) {
    const v = motionSignal(now - (n - k)), x = lerp(x0, x1, k / n), y = yMid - v * 60;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.lineWidth = 3; ctx.strokeStyle = C.sky; ctx.shadowColor = C.sky; ctx.shadowBlur = 12; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
  // state chip
  const states = [[0, 'Walking', C.ice], [13.6, 'On the platform', C.ice], [14.9, 'Train pulling away', C.late], [16.4, 'Riding', C.ok]];
  let st = states[0]; states.forEach(s => { if (t >= s[0]) st = s; });
  const pop = 1 + 0.08 * Math.exp(-Math.pow((t - st[0]) * 6, 2));
  ctx.save(); ctx.translate(44, 448); ctx.scale(pop, pop); chip(0, -18, st[1], st[2], 1, 19); ctx.restore();

  // candidates
  const cands = [['A', '8:52', 0.86], ['C', '8:53', 0.09], ['F', '8:51', 0.05]];
  const k0 = seg(t, 16.6, 17.6);
  if (k0 > 0) {
    text('WHICH TRAIN?', 44, 540, { size: 15, weight: 700, color: C.faint, spacing: 2, alpha: k0, display: false });
    cands.forEach((c, i) => {
      const a = easeOut(seg(t, 16.8 + i * 0.2, 17.6 + i * 0.2)), y = 570 + i * 64;
      const settled = easeInOut(seg(t, 18.4, 19.4));
      const val = lerp(0.33, c[2], settled);
      bullet(64, y + 22, 20, c[0], a);
      text(`left ${c[1]}`, 100, y + 30, { size: 20, weight: 500, color: C.dim, alpha: a, display: false });
      ctx.save(); ctx.globalAlpha = a;
      rrect(210, y + 14, 150, 14, 7); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
      rrect(210, y + 14, 150 * val * easeOut(a), 14, 7); ctx.fillStyle = i === 0 ? C.sky : 'rgba(156,196,255,0.45)'; ctx.fill();
      ctx.restore();
    });
  }
  // the result
  const rk = easeOut(seg(t, 19.6, 20.4));
  if (rk > 0) {
    ctx.save(); ctx.globalAlpha = rk; ctx.translate(0, (1 - rk) * 30);
    rrect(20, 770, PW - 40, 74, 22); ctx.fillStyle = C.blue; ctx.fill();
    bullet(62, 807, 22, 'A');
    text("You're on the 8:52 A", 98, 801, { size: 23, weight: 700 });
    text('Off at W 4 St · 9:03', 98, 828, { size: 18, weight: 500, color: 'rgba(255,255,255,0.8)', display: false });
    ctx.restore();
  }
}

// ---------- scene 4: best route mid-trip ----------
function routeScreen(t) {
  // Live Activity style card
  text('On the F', 32, 120, { size: 22, weight: 600, color: C.dim, display: false });
  text('Arrive 9:24', 32, 162, { size: 40, weight: 700 });
  // line diagram
  screenCard(20, 196, PW - 40, 300);
  const stops = ['7 Av', '15 St', '4 Av–9 St', 'Carroll', 'Bergen', 'Jay St'];
  const prog = clamp((t - 24) / 9, 0, 1) * 3.2;
  stops.forEach((s, i) => {
    const y = 236 + i * 46;
    ctx.fillStyle = i <= prog ? L.F : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(60, y, i === 5 ? 10 : 7, 0, Math.PI * 2); ctx.fill();
    if (i < 5) { ctx.fillRect(57, y, 6, 46); }
    text(s, 86, y + 7, { size: 20, weight: i === 5 ? 700 : 500, color: i === 5 ? C.ink : C.dim, display: false });
  });
  // the train
  const ty = 236 + prog * 46;
  ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 20; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(60, ty, 9, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // reroute banner
  const bk = easeOut(seg(t, 27.4, 28.2));
  if (bk > 0) {
    const pulse = 0.5 + 0.5 * Math.sin((t - 27.4) * 5);
    ctx.save(); ctx.translate(0, (1 - bk) * -140); ctx.globalAlpha = bk;
    ctx.shadowColor = C.ok; ctx.shadowBlur = 20 + pulse * 20;
    rrect(16, 60, PW - 32, 112, 28); ctx.fillStyle = '#123a2c'; ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = C.ok + 'aa'; ctx.lineWidth = 2; ctx.stroke();
    text('4 min sooner', 40, 102, { size: 26, weight: 700, color: C.ok });
    text('At Jay St, cross to the A · in 9:20', 40, 138, { size: 19, weight: 500, color: 'rgba(255,255,255,0.85)', display: false });
    ctx.restore();
  }
  // the change, timed
  const ck = easeOut(seg(t, 30.2, 31));
  if (ck > 0) {
    ctx.save(); ctx.globalAlpha = ck; ctx.translate(0, (1 - ck) * 30);
    screenCard(20, 520, PW - 40, 220);
    text('CHANGE AT JAY ST', 44, 562, { size: 15, weight: 700, color: C.faint, spacing: 2, display: false });
    bullet(62, 612, 22, 'F'); text('→', 96, 620, { size: 26, weight: 500, color: C.dim }); bullet(146, 612, 22, 'A');
    text('Across the platform', 186, 620, { size: 20, weight: 600, display: false });
    text('A arrives 9:11 · 2 min to spare', 44, 676, { size: 20, weight: 500, color: C.dim, display: false });
    rrect(44, 698, PW - 88, 10, 5); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
    rrect(44, 698, (PW - 88) * clamp((t - 30.4) / 2.5) * 0.72, 10, 5); ctx.fillStyle = C.ok; ctx.fill();
    ctx.restore();
  }
}
/** The background map in scene 4: the F the rider is on, the A that gets them in sooner. */
function routeMap(t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(60, 70);
  const pF = new Path2D(); pF.moveTo(1120, 980); pF.bezierCurveTo(1250, 820, 1300, 700, 1420, 600); pF.bezierCurveTo(1560, 480, 1580, 300, 1760, 120);
  const pA = new Path2D(); pA.moveTo(1420, 600); pA.bezierCurveTo(1520, 560, 1620, 470, 1700, 330); pA.bezierCurveTo(1740, 260, 1760, 200, 1780, 110);
  ctx.setLineDash([1400 * easeInOut(seg(t, 24, 26)), 2000]);
  glowStroke(pF, L.F, 9, 16, 0.55 - 0.25 * seg(t, 28, 29));
  ctx.setLineDash([900 * easeInOut(seg(t, 27.6, 29.4)), 2000]);
  glowStroke(pA, '#2e6bff', 11, 30, 1);
  ctx.setLineDash([]);
  ctx.fillStyle = '#fff';
  [[1420, 600], [1780, 110], [1120, 980]].forEach(([x, y], i) => { ctx.beginPath(); ctx.arc(x, y, i === 0 ? 12 : 9, 0, Math.PI * 2); ctx.fill(); });
  const tk = easeOut(seg(t, 28.6, 29.4));
  text('−4 min', 1630, 420, { size: 44, weight: 700, color: C.ok, alpha: tk });
  text('Jay St', 1380, 640, { size: 24, weight: 600, color: C.dim, alpha: seg(t, 25, 26), align: 'right' });
  ctx.restore();
}

// ---------- scene 5: habits ----------
function habits(t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], weeks = 8;
  const gx = 1160, gy = 300, cw = 100, ch = 60;
  days.forEach((d, i) => text(d, gx + i * cw + 30, gy - 24, { size: 20, weight: 600, color: C.faint, align: 'center', display: false }));
  const r = rng(11);
  let shown = 0;
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const weekday = d < 5, ride = weekday ? r() < 0.92 : r() < 0.25;
    const line = weekday ? (r() < 0.86 ? 'F' : 'G') : ['Q', 'A', '7'][Math.floor(r() * 3)];
    const order = w * 7 + d, at = 35.3 + order * 0.055;
    if (!ride) continue;
    const k = easeOut(seg(t, at, at + 0.4)); if (k <= 0) continue;
    shown++;
    const x = gx + d * cw + 30, y = gy + w * ch + 10;
    const glow = weekday && line === 'F' ? easeInOut(seg(t, 39.2, 40)) : 0;
    ctx.save(); ctx.globalAlpha *= k * (1 - 0.6 * easeInOut(seg(t, 39.2, 40)) * (glow ? 0 : 1));
    if (glow) { ctx.shadowColor = L.F; ctx.shadowBlur = 24 * glow; }
    bullet(x, y, 17 * (0.6 + 0.4 * k), line);
    ctx.restore();
  }
  // the pattern, named
  const pk = easeOut(seg(t, 40, 40.8));
  if (pk > 0) {
    ctx.save(); ctx.globalAlpha *= pk; ctx.translate(0, (1 - pk) * 24);
    rrect(gx - 10, gy + weeks * ch + 10, 5 * cw + 20, 92, 24); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.cardLine; ctx.stroke();
    bullet(gx + 40, gy + weeks * ch + 56, 24, 'F');
    text('Your usual', gx + 80, gy + weeks * ch + 48, { size: 18, weight: 600, color: C.dim, display: false });
    text('4 Av–9 St · weekdays · 8:40', gx + 80, gy + weeks * ch + 78, { size: 26, weight: 700 });
    ctx.restore();
  }
  ctx.restore();
}

// ---------- scene 6: insights ----------
const STATIONS = ['Brooklyn Br', 'Bleecker', 'Astor Pl', '14 St', '23 St', '28 St', '33 St', 'Grand Central', '59 St', '86 St', '125 St'];
const marey = (() => {
  const r = rng(3), trains = [];
  for (let i = 0; i < 34; i++) {
    const start = i * 0.042 + r() * 0.01, pts = []; let x = start, late = 0;
    for (let s = 0; s < STATIONS.length; s++) {
      const y = s / (STATIONS.length - 1);
      pts.push([x, y]);
      x += 0.005 + r() * 0.003; pts.push([x, y]);   // dwell at the platform
      let run = 0.026 + r() * 0.005;
      // a signal problem between 28 St and 33 St in the peak, carried up the line
      if (s === 5 && i > 12 && i < 24) { const d = 0.018 + r() * 0.02; run += d; late += d; }
      x += run;
    }
    trains.push({ pts, late });
  }
  return trains;
})();
function insights(t, alpha) {
  if (alpha <= 0) return;
  const x0 = 140, x1 = W - 120, y0 = 190, y1 = H - 140;
  ctx.save(); ctx.globalAlpha *= alpha;
  // station rails
  STATIONS.forEach((s, i) => {
    const y = lerp(y0, y1, (STATIONS.length - 1 - i) / (STATIONS.length - 1));
    const k = easeOut(seg(t, 42.2 + i * 0.05, 43 + i * 0.05));
    ctx.fillStyle = `rgba(156,196,255,${0.1 * k})`; ctx.fillRect(x0 + 120, y, (x1 - x0 - 120) * k, 1.5);
    text(s, x0 + 100, y + 6, { size: 17, weight: 500, color: C.faint, align: 'right', alpha: k, display: false });
  });
  // the trains drawn as time passes
  const reveal = lerp(0, 1.65, easeInOut(seg(t, 42.6, 50)));
  const focus = easeInOut(seg(t, 49.2, 50.4));
  marey.forEach((tr, i) => {
    const p = new Path2D(); let started = false;
    for (let k = 0; k < tr.pts.length; k++) {
      const [tx, ty] = tr.pts[k]; if (tx > reveal) break;
      const x = lerp(x0 + 120, x1, tx / 1.65), y = lerp(y1, y0, ty);
      started ? p.lineTo(x, y) : p.moveTo(x, y); started = true;
    }
    const sev = clamp(tr.late / 0.03);
    const col = sev > 0.6 ? C.red : sev > 0.1 ? C.late : C.sky;
    glowStroke(p, col, sev > 0.1 ? 3.5 : 2.5, sev > 0.1 ? 14 : 6, lerp(0.85, sev > 0.1 ? 1 : 0.25, focus));
  });
  // the segment where time is lost
  if (focus > 0) {
    const ya = lerp(y1, y0, 6 / 10), yb = lerp(y1, y0, 5 / 10);
    ctx.fillStyle = `rgba(255,74,61,${0.12 * focus})`; ctx.fillRect(x0 + 120, ya, x1 - x0 - 120, yb - ya);
  }
  ctx.restore();
}
function diagnosisCard(t, x, y) {
  const k = easeOut(seg(t, 50.2, 51)), o = 1 - easeIn(seg(t, 54.2, 54.8));
  if (k * o <= 0) return;
  ctx.save(); ctx.globalAlpha = k * o; ctx.translate((1 - k) * 60, 0);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50;
  rrect(x, y, 560, 330, 30); ctx.fillStyle = 'rgba(14,22,46,0.94)'; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = C.cardLine; ctx.lineWidth = 1.5; ctx.stroke();
  bullet(x + 50, y + 54, 22, '6');
  text('Grand Central–42 St · uptown', x + 86, y + 50, { size: 22, weight: 700 });
  text('9 AM · severity 43 / 100', x + 86, y + 76, { size: 18, weight: 500, color: C.dim, display: false });
  const rows = [['WHERE', 'Starts upstream, 28 St → 33 St'], ['WHY', 'Signal problem · 38× more likely'], ['COST', '~16 rider-hours lost a day'], ['AVOID', 'Check the 6 before 9 · take the 4']];
  rows.forEach(([a, b], i) => {
    const rk = easeOut(seg(t, 50.8 + i * 0.25, 51.5 + i * 0.25));
    text(a, x + 36, y + 140 + i * 48, { size: 14, weight: 700, color: i === 1 ? C.red : C.faint, spacing: 2, alpha: rk, display: false });
    text(b, x + 130, y + 140 + i * 48, { size: 21, weight: 600, alpha: rk, display: false });
  });
  ctx.restore();
}

// ---------- the film ----------
function render(t) {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  background(t, seg(t, 42, 46) * (1 - seg(t, 55, 57)) * 0.5);
  dust(t, 0.5 * (1 - seg(t, 54, 56) * 0.6));

  // 1 + 2: the city's lines, gathering into a fork (0 - 13)
  const conv = easeInOut(seg(t, 6.2, 9.6));
  const cityA = 1 - easeIn(seg(t, 11.6, 12.6));
  if (cityA > 0) {
    ctx.save();
    const z = lerp(1, 1.08, seg(t, 0, 12));
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    cityLines(t, conv, cityA);
    ctx.restore();
  }
  { // a soft scrim so the opening lines read over the lines
    const a = life(t, 0.6, 12.2, 0.8);
    if (a > 0) {
      const cy = t < 6 ? 520 : 230, g = ctx.createRadialGradient(W / 2, cy, 0, W / 2, cy, 620);
      g.addColorStop(0, `rgba(5,7,13,${0.82 * a})`); g.addColorStop(1, 'rgba(5,7,13,0)');
      ctx.save(); ctx.translate(W / 2, cy); ctx.scale(1, 0.38); ctx.translate(-W / 2, -cy); ctx.fillStyle = g; ctx.fillRect(0, cy - 700, W, 1400); ctx.restore();
    }
  }
  riseText(t, '8:47 AM', W / 2, 470, 0.8, 5.2, { size: 30, weight: 500, color: C.ice, align: 'center', spacing: 6, display: false });
  riseText(t, 'Somewhere under Manhattan.', W / 2, 560, 1.6, 5.4, { size: 76, weight: 700, align: 'center', blur: true });
  riseText(t, 'Every morning, millions of New Yorkers', W / 2, 200, 6.6, 9.4, { size: 54, weight: 600, align: 'center', color: C.dim });
  riseText(t, 'make the same bet.', W / 2, 280, 7.6, 9.4, { size: 72, weight: 700, align: 'center' });
  {
    const k = easeOut(seg(t, 9.8, 10.8)), o = 1 - easeIn(seg(t, 11.6, 12.4));
    if (k * o > 0) {
      ctx.save(); ctx.globalAlpha = k * o; ctx.filter = `blur(${(1 - k) * 14}px)`;
      const sc = lerp(1.25, 1, k);
      ctx.translate(W / 2, 250); ctx.scale(sc, sc);
      text('Which way?', 0, 0, { size: 150, weight: 800, align: 'center' });
      ctx.restore();
    }
  }

  // 3: detection (12 - 23.6)
  const s3 = life(t, 12, 23.8, 0.8);
  if (s3 > 0) {
    const slide = easeOut(seg(t, 12, 13.4));
    phone(lerp(1500, 1360, slide), 540, 1.0, s3, () => detectionScreen(t));
    ctx.save(); ctx.globalAlpha = s3;
    riseText(t, 'You step on.', 180, 380, 12.6, null, { size: 96, weight: 800 });
    riseText(t, 'It already knows.', 180, 490, 13.6, null, { size: 96, weight: 800, color: C.sky });
    riseText(t, 'Your phone feels the train pull away and', 184, 600, 15.2, null, { size: 32, weight: 500, color: C.dim, display: false });
    riseText(t, 'matches the moment to every train in the', 184, 644, 15.4, null, { size: 32, weight: 500, color: C.dim, display: false });
    riseText(t, 'live MTA feed. Express or local, it counts', 184, 688, 15.6, null, { size: 32, weight: 500, color: C.dim, display: false });
    riseText(t, 'the stops you feel. No tapping. No guessing.', 184, 732, 15.8, null, { size: 32, weight: 500, color: C.dim, display: false });
    ctx.restore();
  }

  // 4: the best way, mid-trip (23.6 - 35)
  const s4 = life(t, 23.6, 35.2, 0.8);
  if (s4 > 0) {
    routeMap(t, s4);
    const slide = easeOut(seg(t, 23.6, 25));
    phone(lerp(500, 640, slide), 540, 1.0, s4, () => routeScreen(t));
    ctx.save(); ctx.globalAlpha = s4;
    riseText(t, 'Plans change', 1000, 300, 24.4, null, { size: 84, weight: 800 });
    riseText(t, 'underground.', 1000, 395, 25, null, { size: 84, weight: 800 });
    riseText(t, 'A faster way appears? You know before', 1004, 472, 28.4, null, { size: 30, weight: 500, color: C.dim, display: false });
    riseText(t, 'the doors close. Every change, timed.', 1004, 514, 28.6, null, { size: 30, weight: 500, color: C.dim, display: false });
    ctx.restore();
  }

  // 5: it learns you (35 - 42.4)
  const s5 = life(t, 35, 42.6, 0.7);
  if (s5 > 0) {
    habits(t, s5);
    ctx.save(); ctx.globalAlpha = s5;
    riseText(t, 'The more you ride,', 180, 440, 35.4, null, { size: 84, weight: 800 });
    riseText(t, 'the better it knows you.', 180, 540, 36.2, null, { size: 84, weight: 800, color: C.sky });
    riseText(t, 'Your habits are learned on your phone.', 184, 640, 37.4, null, { size: 30, weight: 500, color: C.dim, display: false });
    riseText(t, 'Your location is never shared.', 184, 682, 37.6, null, { size: 30, weight: 500, color: C.dim, display: false });
    ctx.restore();
  }

  // 6: the insights platform (42.2 - 55)
  const s6 = life(t, 42.2, 55.2, 0.8);
  if (s6 > 0) {
    insights(t, s6);
    // a dark wash behind the headline so it reads over the chart
    ctx.save(); ctx.globalAlpha = s6;
    const g = ctx.createLinearGradient(0, 0, 0, 260); g.addColorStop(0, 'rgba(5,7,13,0.95)'); g.addColorStop(1, 'rgba(5,7,13,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 260);
    riseText(t, 'Behind every suggestion, a living model of the whole subway.', W / 2, 110, 42.8, 46.6, { size: 54, weight: 700, align: 'center' });
    riseText(t, 'Every train. Every stop. Every 30 seconds.', W / 2, 110, 47, 50, { size: 54, weight: 700, align: 'center', color: C.ice });
    riseText(t, 'It knows where trains are late, and why.', W / 2, 110, 50.4, null, { size: 54, weight: 700, align: 'center' });
    // small facts along the bottom
    const facts = ['Delays traced to where they start', 'Incidents caught before an alert exists', 'Disruption history back to 2020'];
    facts.forEach((f, i) => {
      const fx = 260 + i * 620;
      riseText(t, f, fx, H - 60, 44.6 + i * 0.5, null, { size: 24, weight: 600, color: C.dim, display: false });
      ctx.save(); ctx.globalAlpha *= easeOut(seg(t, 44.6 + i * 0.5, 45.4 + i * 0.5));
      ctx.fillStyle = C.sky; ctx.beginPath(); ctx.arc(fx - 22, H - 68, 6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });
    diagnosisCard(t, W - 700, 330);
    ctx.restore();
  }

  // 7: the mark (54.6 - 62)
  if (t > 54.4) {
    const k = easeOut(seg(t, 54.6, 56));
    const tileK = lerp(0.6, 1, expoOut(seg(t, 54.6, 56.4)));
    const markK = { stem: seg(t, 55, 56), right: easeInOut(seg(t, 55.6, 56.8)), left: easeInOut(seg(t, 55.8, 57)), dot: seg(t, 56.6, 57.3) };
    const out = 1 - easeIn(seg(t, 60.8, 62));
    ctx.save(); ctx.globalAlpha = k * out;
    const lift = easeInOut(seg(t, 57.2, 58.4));
    iconTile(W / 2, lerp(540, 430, lift), 300, tileK, markK);
    riseText(t, 'WhichWay', W / 2, 700, 57.4, null, { size: 104, weight: 800, align: 'center', spacing: -2 });
    riseText(t, 'Know which way. Every time.', W / 2, 770, 58.1, null, { size: 40, weight: 500, align: 'center', color: C.ice, display: false });
    riseText(t, 'Coming soon for iPhone', W / 2, 870, 58.9, null, { size: 26, weight: 600, align: 'center', color: C.faint, spacing: 3, display: false });
    ctx.restore();
  }

  vignette(0.6);
  // fade up from black and down to black
  const black = Math.max(1 - seg(t, 0, 0.8), seg(t, 61.2, 62));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

window.render = render;
window.DURATION = DURATION;
window.ready = document.fonts.load('700 40px "Inter Display"').then(() => document.fonts.load('500 40px Inter'));
if (!location.search.includes('static')) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
