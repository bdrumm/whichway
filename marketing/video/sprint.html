<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WhichWay: Know When to Run</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="kit.js"></script>
<script src="pickup-kit.js"></script>
<script src="engine.js"></script>
<script src="cine.js"></script>
<script src="nyc.js"></script>
<script>
// "Know When to Run": a man who takes his commute seriously. His record from his front door to the doors of the 8:14
// is 2:08, and the app tells him to the second when those doors open, so every morning is a race: out of the door at
// dawn, down the block, across the side street, down the stairs, through the turnstile, along the passage and through
// the doors as they close. Cut to techno at 150 bpm (a beat is 0.4 s, a bar 1.6 s; he lands a foot on every eighth
// note), with the two clocks on screen the whole way: the app's count to the doors, and his own. The next morning the
// train is four minutes late, the app says so, and he walks. 48 s. Drawn with nyc.js; the score is `sprint`.
const DURATION = 48, END = 41.6, B = 0.4;
const RUN0 = 3.2, RATE = 4.5, OPEN = 115, CLOSE = 130, FIN = 127.9, TFIN = RUN0 + FIN / RATE;   // the run, in film and story seconds
const story = t => clamp((t - RUN0) * RATE, 0, FIN);
const YEL = '#ffd23a', PURPLE = '#c58bff';
const RUNNER = { coat: YEL, legs: '#12142a', skin: '#d9a077', hair: { style: 'short', color: '#1a1210' }, bag: '#23264a' };
const GROUND = 850, VW = 1000, MAN = 115;           // the street's ground line, his speed along it (world px/s), his height
const CAD = Math.PI * 2 * 2.5;                      // five footfalls a second
const HOME = (() => { let d = 1e9, x = 0; STOOPS.forEach(b => { const c = b.x + b.w * 0.62 + 24; if (Math.abs(c - 900) < d) { d = Math.abs(c - 900); x = c; } }); return x; })();   // his front door
const runX = t => { const u = Math.max(0, t - RUN0); return HOME + 30 + VW * (u - 0.25 * (1 - Math.exp(-u / 0.25))); };
const beatK = t => (t >= RUN0 && t < 32 && !(t >= 16 && t < 17.6) ? Math.exp(-((t - RUN0) % B) / 0.09) : 0);   // the kick, seen
const fmtS = (s, tenths = true) => { const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${tenths ? r.toFixed(1).padStart(4, '0') : String(Math.floor(r)).padStart(2, '0')}`; };
const line1 = { size: 76, weight: 700, spacing: -1.5 };

// ---------- the street at dawn ----------
function dawnSky(t, day = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, 900);
  (day ? [[0, '#6f93e6'], [0.2, '#b9b4ee'], [0.36, '#ffc9a2'], [1, '#ffe2a8']] : [[0, '#0a1038'], [0.42, '#3b2472'], [0.72, '#c4486c'], [0.9, '#ff8a4a'], [1, '#ffd08a']]).forEach(([k, c]) => g.addColorStop(k, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 7; i++) { ctx.fillStyle = `rgba(255,${150 + 40 * hash(i)},130,${0.1 + 0.1 * hash(i + 2)})`; ctx.beginPath(); ctx.ellipse((hash(i + 5) * 2400 + t * 6) % 2400 - 200, 60 + hash(i + 9) * 300, 280 + hash(i) * 360, 9 + hash(i + 1) * 14, 0, 0, Math.PI * 2); ctx.fill(); }
  glowAt(1500, 420, 900, '255,170,90', 0.45);
}
function farCity(t, base, shift = 0, day = 0) {
  const fill = day ? '#8f86c9' : '#2a1c5e';
  drawBlock(BLOCKS.far, t, { base, fill, dx: -shift, winA: day ? 0 : 0.3, lit: 0.16, sx: 10, sy: 13, ww: 3.5, wh: 5 });
  empire(560 - shift, base, 0.6, fill, day ? 0 : 0.3);
}
/** The first sun over everything: warm from the right, violet in the shade. */
function dawnWash(a = 1) {
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; const g = ctx.createLinearGradient(W, 0, 0, H); g.addColorStop(0, `rgba(255,150,70,${0.7 * a})`); g.addColorStop(1, `rgba(90,60,200,${0.4 * a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  glowAt(W + 100, 260, 1200, '255,160,90', 0.2 * a);
}
/** The row of houses in world coordinates between x0 and x1, dragged `smear` px by the speed of the camera. */
function row(t, x0, x1, smear = 0, lit = 0.3) {
  stoopsAlong(t, x0, x1, { ground: GROUND, smear, lit });
  if (smear < 3) return;
  for (let i = Math.floor(x0 / 700) - 1; i < x1 / 700 + 1; i++) for (let g = 0; g < 4; g++) glowAt(i * 700 + 300 + g * smear * 0.8, GROUND - 330, 190, '255,205,130', 0.14);   // street lamps, still lit
}
function pavement(t, x0, x1, smear = 0) {
  const g = ctx.createLinearGradient(0, GROUND, 0, GROUND + 260); g.addColorStop(0, '#5a3d62'); g.addColorStop(0.1, '#2a1e42'); g.addColorStop(1, '#0a0812');
  ctx.fillStyle = g; ctx.fillRect(x0 - 100, GROUND, x1 - x0 + 200, 500);
  ctx.fillStyle = 'rgba(255,190,140,0.3)'; ctx.fillRect(x0 - 100, GROUND + 36, x1 - x0 + 200, 2.5);   // the kerb
  for (let i = Math.floor(x0 / 90) - 1; i < x1 / 90 + 1; i++) { ctx.fillStyle = `rgba(255,200,160,${0.06 + 0.1 * hash(i + 3)})`; ctx.fillRect(i * 90 + hash(i) * 40, GROUND + 4 + hash(i + 7) * 28, 5 + smear * 1.5, 1.6); }
  for (let i = Math.floor(x0 / 240) - 1; i < x1 / 240 + 1; i++) { ctx.fillStyle = 'rgba(255,230,180,0.2)'; ctx.fillRect(i * 240, GROUND + 118, 110 + smear * 2, 5); }
}
/** A side street looking east: the sun at the end of it, and a crossing. Behind him, then under him. */
function crossStreet(gx, w) {
  ctx.save(); ctx.beginPath(); ctx.rect(gx, GROUND - 800, w, 800); ctx.clip();
  const g = ctx.createLinearGradient(0, GROUND - 800, 0, GROUND); g.addColorStop(0, '#5a2f86'); g.addColorStop(0.6, '#ff7a4f'); g.addColorStop(1, '#ffe0a0'); ctx.fillStyle = g; ctx.fillRect(gx, GROUND - 800, w, 800);
  ctx.fillStyle = '#fff6d6'; ctx.beginPath(); ctx.arc(gx + w / 2, GROUND - 110, 64, 0, Math.PI * 2); ctx.fill();
  [[0, 0.3, '#3a1d4a'], [0.08, 0.36, '#6a2c56'], [0.2, 0.42, '#a4455c']].forEach(([a, b, c], i) => { const top = GROUND - 760 + i * 190; poly([[gx + w * a, top], [gx + w * b, top + 300], [gx + w * b, GROUND], [gx + w * a, GROUND]], c); poly([[gx + w * (1 - a), top], [gx + w * (1 - b), top + 300], [gx + w * (1 - b), GROUND], [gx + w * (1 - a), GROUND]], c); });
  ctx.restore();
  glowAt(gx + w / 2, GROUND - 110, 620, '255,200,120', 0.75);
}
function crossing(gx, w) {
  const g = ctx.createLinearGradient(0, GROUND, 0, GROUND + 200); g.addColorStop(0, 'rgba(255,190,110,0.55)'); g.addColorStop(1, 'rgba(255,190,110,0)'); ctx.fillStyle = g; ctx.fillRect(gx, GROUND, w, 200);
  for (let x = gx + 20; x < gx + w - 30; x += 74) poly([[x, GROUND + 4], [x + 40, GROUND + 4], [x + 26, GROUND + 110], [x - 20, GROUND + 110]], 'rgba(255,244,220,0.8)');
}

// ---------- the runner ----------
function runner(x, y, h, t, { o = {}, ghosts = 3, air = 1 } = {}) {
  const ph = (t - RUN0) * CAD, hop = Math.abs(Math.sin(ph)) * h * 0.05 * air;
  const pose = { ...RUNNER, walk: ph, stride: 1.8, lean: 0.26, tails: 0.8, arm: 'pump', ...o };
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x, y + h * 0.02, h * 0.2, h * 0.035, 0, 0, Math.PI * 2); ctx.fill();
  for (let g = ghosts; g > 0; g--) { ctx.save(); ctx.globalAlpha *= 0.15; figure(x - (pose.dir || 1) * g * h * 0.12, y - hop, h, { ...pose, walk: ph - g * 0.5 }); ctx.restore(); }
  figure(x, y - hop, h, pose);
}
/** The chase: the camera runs with him. `k` is how close, `lead` how much room he has in front, `behind`, `under`
 *  and `front` draw what he passes, in world coordinates. */
function chase(t, { k = 3, lead = 0.13, fy = GROUND - 95, mirror = false, behind = null, under = null, front = null, lift = 0, sky = 360, lines = 0.9, posts = true, gaps = [] } = {}) {
  const X = runX(t), fx = X + (W * lead) / k, x0 = fx - W / 2 / k - 60, x1 = fx + W / 2 / k + 60, sm = (VW / 30) * 0.85;
  ctx.save(); if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  dawnSky(t); farCity(t, sky, (X - HOME) * 0.012);
  camera(k * (1 + 0.022 * beatK(t)), fx + noise1(t * 17, 1) * 5 / k, fy + noise1(t * 21, 2) * 7 / k, () => {
    row(t, x0, x1, sm, 0.6);
    gaps.forEach(g => crossStreet(g, 560));
    if (behind) behind(x0, x1);
    pavement(t, x0, x1, sm);
    gaps.forEach(g => crossing(g, 560));
    if (under) under(x0, x1);
    runner(X, GROUND - lift, MAN, t);
    if (front) front(x0, x1);
  });
  dawnWash();
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const sun = ctx.createLinearGradient(W, 0, 0, 0); sun.addColorStop(0, 'rgba(255,140,60,0.26)'); sun.addColorStop(1, 'rgba(255,90,120,0.04)'); ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H); ctx.restore();
  speedLines(t, lines);
  if (posts) {   // what stands between the camera and him: a post or a trunk every other beat, gone before it can be read
    const span = 5040, x = W + 400 - ((fx * k * 2.1) % span + span) % span, w = 40 + 14 * k;
    const pg = ctx.createLinearGradient(x, 0, x + w + 200, 0); pg.addColorStop(0, 'rgba(10,6,20,0.85)'); pg.addColorStop(0.3, 'rgba(10,6,20,0.7)'); pg.addColorStop(1, 'rgba(10,6,20,0)'); ctx.fillStyle = pg; ctx.fillRect(x, 0, w + 200, H);
  }
  ctx.restore();
}

// ---------- 0-3.2: the door ----------
function homeShot(t, k, fx, fy, { open = 0, day = 0, who = null, lit = 0.3 } = {}) {
  const x0 = fx - W / 2 / k - 60, x1 = fx + W / 2 / k + 60;
  dawnSky(t, day); farCity(t, 540 + (330 - fy) * k, 0, day);
  camera(k, fx, fy, () => {
    row(t, x0, x1, 0, lit);
    if (open > 0) { ctx.fillStyle = `rgba(255,226,170,${open})`; ctx.fillRect(HOME - 24, GROUND - 146, 48, 106); glowAt(HOME, GROUND - 90, 170, '255,214,150', 0.6 * open); }
    pavement(t, x0, x1, 0);
    if (who) who();
  });
  dawnWash(day ? 0.6 : 1);
  if (day) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createLinearGradient(W, 0, 0, H); g.addColorStop(0, 'rgba(255,190,130,0.3)'); g.addColorStop(1, 'rgba(150,140,255,0.12)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
function sIntro(t) {
  const k = 1.08 + 0.52 * easeInOut(seg(t, 0, 3.2));
  homeShot(t, k, HOME - 60 + 150 * easeInOut(seg(t, 0, 3.2)), 545 + 75 * easeInOut(seg(t, 0, 3.2)), { open: 0.35 * seg(t, 2.4, 2.9) });
  scrim('left', 0.82);
  slam(t, 'Some people take', 140, 430, 0.4, 3.0, { size: 88 });
  slam(t, 'their commute', 140, 530, 1.2, 3.0, { size: 88 });
  slam(t, 'seriously.', 140, 660, 2.0, 3.0, { size: 132, color: YEL, spacing: -3 });
}
function sDoor(t) {
  const u = t - 3.2, e = easeInOut(seg(u, 0.1, 1.3)), X = runX(t), k = lerp(1.6, 3.0, e), drop = 38 * Math.pow(clamp(1 - u / 0.24), 2);
  homeShot(t, k * (1 + 0.022 * beatK(t)), lerp(HOME + 90, X + (W * 0.13) / 3.0, e), lerp(620, GROUND - 95, e), { open: 1, who: () => runner(X, GROUND - drop, MAN, t) });
  speedLines(t, 0.9 * e);
}

// ---------- 4.8-16: the block ----------
function sChase1(t) {
  if (t < 6.4) chase(t, { k: 3.0 }); else chase(t, { k: 1.9, fy: GROUND - 150, lead: 0.16, gaps: [GAP1], posts: false });
  scrim('bottom', 0.7);
  slam(t, 'Every morning.', 140, 950, 4.8, 6.3, { size: 96, spacing: -2 });
  slam(t, 'The 8:14.', 140, 950, 6.4, 7.9, { size: 120, color: YEL, spacing: -3 });
}
function bigNumber(t, s, name, bg, ink) {
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  speedLines(t, 0.7, { n: 46 });
  text(name, W / 2, 300, { size: 40, weight: 700, color: ink, align: 'center', spacing: 10, display: false, alpha: 0.8 });
  text(s, W / 2 + noise1(t * 40, 4) * 8, 730, { size: 440, weight: 800, color: ink, align: 'center', mono: true, spacing: -20 });
}
function sInserts(t) {
  const i = Math.min(3, Math.floor((t - 8.0) / B));
  if (i === 0) chase(t, { k: 8.5, fy: GROUND - 26, lead: 0.02, posts: false });   // his feet
  else if (i === 1) bigNumber(t, fmtS(story(t)), 'DOOR TO DOORS', '#07060f', YEL);
  else if (i === 2) chase(t, { k: 8.5, fy: GROUND - 90, lead: 0.02, posts: false });   // his face
  else bigNumber(t, fmtS(OPEN - story(t), false), 'DOORS OPEN IN', L.F, '#fff');
}
const GAP1 = runX(7.0) - 100, GAP = runX(11.05), CRATE = runX(12.22), GAP3 = runX(15.1) - 200;
function sChase2(t) {
  const lift = 62 * Math.sin(Math.PI * seg(t, 11.96, 12.48));
  chase(t, { k: 1.12, fy: 540, lead: 0.1, lift, lines: 0.5, posts: false,
    gaps: [GAP],
    under: () => {
      // a hand truck of boxes left on the pavement: he goes over it
      ctx.fillStyle = '#7a4a2c'; ctx.fillRect(CRATE - 24, GROUND - 46, 50, 46); ctx.fillStyle = '#93603a'; ctx.fillRect(CRATE - 18, GROUND - 82, 40, 36); ctx.fillStyle = '#5d371f'; ctx.fillRect(CRATE - 24, GROUND - 24, 50, 3); ctx.strokeStyle = '#0c0a14'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(CRATE + 30, GROUND); ctx.lineTo(CRATE + 30, GROUND - 100); ctx.stroke(); } });
  // a cab on the avenue, close enough to the lens to hide him for a moment
  const c = seg(t, 11.02, 11.42);
  if (c > 0 && c < 1) for (let g = 4; g >= 0; g--) { ctx.save(); ctx.globalAlpha = g ? 0.22 : 1; taxi(lerp(W + 900, -900, c) + g * 150, 1075, 3.4, -1); ctx.restore(); }
  scrim('bottom', 0.6);
  say(t, 'He has never missed it.', 140, 960, 9.75, 12.3, { ...line1, size: 64 });
}
function sChase3(t) {
  const walkers = (side, x0, x1) => {
    for (let i = Math.floor(x0 / 310) - 1; i < x1 / 310 + 1; i++) {
      if ((i % 2 === 0) !== (side === 0)) continue;
      const x = i * 310 + hash(i) * 120, h = 104 + hash(i + 2) * 22, dark = side ? '#150f26' : '#2a1d3e', o = { coat: dark, legs: dark, skin: dark, hat: hash(i + 4) < 0.35 ? dark : false, bag: hash(i + 6) < 0.5 ? dark : false, dir: hash(i + 8) < 0.5 ? 1 : -1, walk: t * 5 + i };
      for (let g = 2; g >= 0; g--) { ctx.save(); ctx.globalAlpha *= g ? 0.3 : 1; figure(x + g * 9, GROUND + (side ? 12 : -5), h, o); ctx.restore(); }
    }
  };
  if (t < 14.4) chase(t, { k: 4.2, mirror: true, lead: 0.1, fy: GROUND - 80, lift: -3 + 3 * Math.sin(t * 7), behind: (a, b) => walkers(0, a, b), front: (a, b) => walkers(1, a, b) });
  else chase(t, { k: 2.3, lead: 0.15, fy: GROUND - 130, gaps: [GAP3], behind: (a, b) => walkers(0, a, b), front: (a, b) => walkers(1, a, b), posts: false });
}
const ENT = runX(16.5);
function sEntrance(t) {
  const u = t - 16.0, T0 = 16.52, down = Math.max(0, t - T0);
  const X = down > 0 ? ENT + 24 + down * 420 : runX(t), Y = GROUND + (down > 0 ? down * 420 * 0.44 : 0);
  const k = 2.1 + 0.9 * easeIn(seg(u, 0, 1.6)), fx = lerp(ENT - 150, ENT + 150, easeOut(seg(u, 0, 1.2))), x0 = fx - W / 2 / k - 60, x1 = fx + W / 2 / k + 60;
  dawnSky(t);
  camera(k, fx, GROUND - 100 - 60 * easeIn(seg(u, 0.6, 1.6)), () => {
    row(t, x0, x1, 0); pavement(t, x0, x1, 0);
    subwayEntrance(ENT, GROUND, t, 'F');
    ctx.save(); ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, GROUND + 5); ctx.clip();
    runner(X, Y, MAN, t, { o: down > 0 ? { stride: 1.2, lean: 0.12 } : {}, ghosts: down > 0 ? 1 : 3 });
    ctx.restore();
  });
  dawnWash();
  speedLines(t, 0.8 * (1 - seg(u, 0.3, 0.7)));
  const gl = easeIn(seg(u, 0.9, 1.6)); if (gl > 0) { ctx.fillStyle = `rgba(62,224,143,${0.55 * gl})`; ctx.fillRect(0, 0, W, H); }   // into the green
}

// ---------- 17.6-25.6: underground ----------
const TH = 0.56, TILE = ['#8d9186', '#dfe2d3', '#a7ab9e'];
/** A flight of stairs in cross-section, going down to the right; the camera goes down with him. */
function stairs(t, u, cx = 900, cy = 600) {
  const v = 1500, s = u * v, c = Math.cos(TH), sn = Math.sin(TH), wrap = (x, m) => ((x % m) + m) % m;
  ctx.fillStyle = '#0b0c14'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(TH);
  const wg = ctx.createLinearGradient(0, -520, 0, 700); wg.addColorStop(0, TILE[0]); wg.addColorStop(0.45, TILE[1]); wg.addColorStop(1, TILE[2]); ctx.fillStyle = wg; ctx.fillRect(-1800, -520, 3600, 1600);
  ctx.strokeStyle = 'rgba(60,70,60,0.16)'; ctx.lineWidth = 2; for (let y = -500; y < 900; y += 46) { ctx.beginPath(); ctx.moveTo(-1800, y); ctx.lineTo(1800, y); ctx.stroke(); }
  ctx.fillStyle = '#1f5e4c'; ctx.fillRect(-1800, -300, 3600, 48); ctx.fillStyle = '#d7b45a'; ctx.fillRect(-1800, -306, 3600, 6); ctx.fillRect(-1800, -252, 3600, 6);
  for (let i = 0; i < 2; i++) { const x = wrap(i * 1900 - s, 3800) - 1900; for (let g = 5; g >= 0; g--) { ctx.fillStyle = `rgba(16,36,74,${g ? 0.16 : 0.9})`; ctx.fillRect(x + g * 14, -200, 330, 100); } }   // a name tablet going by
  for (let i = 0; i < 3; i++) { const x = wrap(i * 1000 - s, 3000) - 1500; const lg = ctx.createLinearGradient(x, 0, x + 520, 0); lg.addColorStop(0, 'rgba(235,244,255,0.95)'); lg.addColorStop(1, 'rgba(235,244,255,0)'); ctx.fillStyle = lg; ctx.beginPath(); ctx.roundRect(x, -506, 520, 18, 9); ctx.fill(); glowAt(x + 80, -500, 300, '210,230,255', 0.35); }
  ctx.strokeStyle = '#272b36'; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-1800, 96); ctx.lineTo(1800, 96); ctx.stroke();   // the handrail
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-1800, 90); ctx.lineTo(1800, 90); ctx.stroke();
  ctx.restore();
  // the steps under him, in screen space: a sawtooth sliding up and to the left
  const sp = 190, ox = -(s % sp), base = cy + 268;
  for (let g = 3; g >= 0; g--) {
    ctx.fillStyle = g ? 'rgba(13,14,24,0.3)' : '#0d0e18'; ctx.beginPath(); ctx.moveTo(-500, H + 500);
    for (let j = -12; j < 14; j++) { const d = j * sp + ox + g * 22, px = cx + d * c, py = base + d * sn; ctx.lineTo(px, py); ctx.lineTo(px + sp * c, py); }
    ctx.lineTo(W + 500, H + 500); ctx.closePath(); ctx.fill();
  }
  for (let j = -12; j < 14; j++) { const d = j * sp + ox, px = cx + d * c, py = base + d * sn; ctx.fillStyle = 'rgba(255,198,46,0.85)'; ctx.fillRect(px, py - 3, sp * c + 34, 7); }
  // him, in flight
  ctx.save(); ctx.translate(cx - 30, base + 34); ctx.rotate(0.1);
  runner(0, 0, 430, t, { air: 2.4, o: { lean: 0.34 } });
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(TH); ctx.translate(-cx, -cy); speedLines(t, 0.8, { y0: -200, y1: H + 200, n: 34 }); ctx.restore();
}
function sStairs(t) {
  const close = t >= 19.2, z = (close ? 1.7 : 1) * (1 + 0.03 * beatK(t));
  ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(close ? -900 : -960, close ? -700 : -540);
  stairs(t, t - 17.6);
  ctx.restore();
}
function sTurnstile(t) {
  const u = t - 20.8, go = u >= 0.4, X = 1010 + (u - 0.45) * 1350, floor = 890;
  const wg = ctx.createLinearGradient(0, 0, 0, floor); wg.addColorStop(0, TILE[0]); wg.addColorStop(0.4, TILE[1]); wg.addColorStop(1, TILE[2]); ctx.fillStyle = wg; ctx.fillRect(0, 0, W, floor);
  ctx.strokeStyle = 'rgba(60,70,60,0.14)'; ctx.lineWidth = 2; for (let y = 20; y < floor; y += 46) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } for (let x = 30; x < W; x += 92) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, floor); ctx.stroke(); }

}
function flashes(t) {
  let a = 0;
  CUTS.forEach(c => { if (t >= c && t < c + 0.12) a = Math.max(a, 0.3 * (1 - (t - c) / 0.12)); });
  [3.2, 17.6].forEach(c => { if (t >= c) a = Math.max(a, 0.8 * Math.exp(-(t - c) * 9)); });
  if (a > 0) { ctx.fillStyle = `rgba(255,244,224,${a})`; ctx.fillRect(0, 0, W, H); }
  if (t >= 32 && t < 32.5) { const d = t - 32; ctx.fillStyle = d < 0.07 ? '#fff' : `rgba(0,0,0,${1 - seg(d, 0.2, 0.5)})`; ctx.fillRect(0, 0, W, H); }   // the doors shut
}
const SCENES = [[0, sIntro], [3.2, sDoor], [4.8, sChase1], [8.0, sInserts], [9.6, sChase2], [12.8, sChase3], [16.0, sEntrance], [17.6, sStairs], [20.8, sTurnstile], [22.4, sCorridor],
  [25.6, sSplit], [28.8, sDoors], [32.0, sInside], [35.2, sTomorrow]];

  ctx.save(); scene(t); ctx.restore();
  whip(t);
  if (t >= END - 0.5) { const a = seg(t, END - 0.5, END + 0.1); ctx.fillStyle = `rgba(5,7,13,${a})`; ctx.fillRect(0, 0, W, H); endCardData(t, END, 'Know when to run.', 'COMING SOON FOR IPHONE'); }
  hud(t);
  grain(t, 0.1);
  flashes(t);
  vignette(0.45);
  blackFades(t, DURATION);
}
boot(DURATION, render);
